name: Daily Market Report

on:
  schedule:
    # Chạy nhiều khung giờ từ 19h30 đến 23h30 (giờ VN) để backup, dùng phút lẻ để tránh Github queue delay
    - cron: '37 12 * * 1-5' # ~ 19:37 VN
    - cron: '14 14 * * 1-5' # ~ 21:14 VN
    - cron: '41 15 * * 1-5' # ~ 22:41 VN
    - cron: '17 20 * * 1-5' # ~ 03:17 VN sáng hôm sau (thòng lại để backup)
  workflow_dispatch: # Cho phép chạy bằng tay trên web

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Hoặc phiên bản bạn đang dùng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib markdown google-genai playwright python-dotenv requests pdfplumber pymupdf
          # Cài đặt trình duyệt cho playwright
          playwright install chromium
          
      - name: Run Report Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: ./extensions/market_report
        run: |
          python generate_report.py

      - name: Upload Debug Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: ./extensions/market_report/error.png
          if-no-files-found: ignore

      - name: Send Report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        working-directory: ./extensions/market_report
        run: |
          if [ -f "NEW_REPORT_GENERATED" ]; then
            # Đọc tên file PDF báo cáo vừa được tạo
            PDF_FILE=$(cat NEW_REPORT_GENERATED)
            
            if [ -n "$PDF_FILE" ]; then
              echo "Sending $PDF_FILE to Discord..."
              curl -H "Content-Type: multipart/form-data" \
                   -F "file1=@\"$PDF_FILE\"" \
                   -F "payload_json={\"content\": \"**Báo cáo thị trường hôm nay**\", \"flags\": 4096, \"allowed_mentions\": {\"parse\": []}}" \
                   $DISCORD_WEBHOOK_URL
            fi
            
            # Xóa cờ sau khi gửi
            rm "NEW_REPORT_GENERATED"
          else
            echo "Không có file báo cáo MỚI nào được tạo trong lần chạy này. Bỏ qua bước gửi Discord."
          fi


